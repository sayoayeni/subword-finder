<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Subword Finder</title>
</head>
<body>
    <div class="header">
        <h1>Subword Finder</h1>
        <p>Find all the subwords that can be made from a word!</p>

        <nav class="nav-links">
            <a href="#">About the creator</a>
            <a href="#">Contact the creator</a>
        </nav>
    </div>
    <div class="container">
        <input type="text" class="input" id="input"></input>
        <button class="search-btn">Go</button>
        <p class="error">Invalid Word (check if it contains characters that aren't letters)</p>

        <section class="subwords">
            <h2>List of Subwords</h2>
            <div class="subwords-list"></div>
        </section>
    </div>
    
</body>
</html>
